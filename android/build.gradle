// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Capacitor 7 is compiled with Kotlin 1.9.x. Keep transitive Android
    // dependencies (including OneSignal) on that compatible runtime instead
    // of resolving Kotlin 2.2 metadata that the compiler cannot read.
    configurations.configureEach {
        resolutionStrategy.force(
            'org.jetbrains.kotlin:kotlin-stdlib:1.9.25',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
        )
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
